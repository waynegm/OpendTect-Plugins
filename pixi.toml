[workspace]
channels = ["conda-forge"]
name = "WMPlugins"
platforms = ["linux-64", "win-64"]
version = "2026"
description = "Pixi setup to build WMPlugins for OpendTect v2026"

[activation.env]
OpendTect_DIR = "/opt/seismic/OpendTect_rc/2026"
OD_BINARY_BASEDIR = "$OpendTect_DIR"

[dependencies]
cmake = "<4.0"
git = "*"
ninja = "*"
eigen = "*"
geotiff = "*"
libtiff= "*"
nanoflann = "*"
nlohmann_json = "*"
sqlite = "==3.51.1"

[target.win-64.dependencies]
vs2022_win-64 = ">=19.44"
zlib = "1.3.*"

[target.linux-64.dependencies]
gxx = "<13.4"
binutils = "*"
glib = "*"
sysroot_linux-64 = "*"

#[tasks.clone]
# git clone the OpendTect main branch
#cmd = "git clone -b main --depth 1 https://github.com/OpendTect/OpendTect.git"

[target.win-64.tasks.externals]
cmd = [
    "cmake",
    "-G", "Visual Studio 17 2022",
    "-S", "./externals",
    "-B", "./build_pixi/externals",
    "-D", "EXTERNALS_INSTALL_DIR=./build_pixi/externals-install",
    "-D", "CMAKE_PREFIX_PATH=$CONDA_PREFIX/Library",
    "&&",
    "cmake",
    "--build", "./build_pixi/externals",
    "--config", "Release"
]

[target.win-64.tasks.config]
depends-on = ["externals"]
cmd = [
    "cmake",
    "-G", "Visual Studio 17 2022",
    "-S", "./",
    "-B", "./build_pixi",
    "-D", "OpendTect_DIR=$OpendTect_DIR",
    "-D", "CMAKE_INSTALL_PREFIX=./inst/2026",
    "-D", "CMAKE_PREFIX_PATH=$CONDA_PREFIX/Library",
]

[target.linux-64.tasks.externals]
cmd = [
    "cmake",
    "-G", "Ninja Multi-Config",
    "-S", "./externals",
    "-B", "./build_pixi/externals",
    "-D", "EXTERNALS_INSTALL_DIR=./build_pixi/externals-install",
    "-D", "CMAKE_PREFIX_PATH=$CONDA_PREFIX",
    "&&",
    "cmake",
    "--build", "./build_pixi/externals",
    "--config", "Release"
]

[target.linux-64.tasks.config]
depends-on = ["externals"]
cmd = [
    "cmake",
    "-G", "Ninja Multi-Config",
    "-S", "./",
    "-B", "./build_pixi",
    "-D", "OpendTect_DIR=$OpendTect_DIR",
    "-D", "CMAKE_INSTALL_PREFIX=./inst/2026",
    "-D", "CMAKE_PREFIX_PATH=$CONDA_PREFIX"
]

[tasks.build-dev]
cmd = [
    "cmake",
    "--build", "./build_pixi",
    "--config", "Debug",
    "&&",
    "cmake",
    "--install", "./build_pixi",
    "--config", "Debug"
]

[tasks.build]
cmd = [
    "cmake",
    "--build", "./build_pixi",
    "--config", "Release",
    "&&",
    "cmake",
    "--install", "./build_pixi",
    "--config", "Release"
]

[tasks.clean]
cmd = ["cmake", "-E", "remove_directory", "build_pixi"]

[tasks.reconfigure]
depends-on = ["clean", "config"]

[target.linux-64.tasks.release]
cmd = "$OpendTect_DIR/bin/lux64/Release/od_main"
env = {OD_USER_PLUGIN_DIR="./inst/2026", QT_QPA_PLATFORM="xcb"}

[target.win-64.tasks.release]
cmd = "$OpendTect_DIR/bin/win64/Release/od_main.exe"
env = {OD_USER_PLUGIN_DIR="./inst/2026"}

[environments.wmpy]
no-default-feature = true
dependencies = {
    python  = "3.12.*",
    pytest = "*",
    numpy = "*",
    numba = "*",
    jupyterlab = "*",
    matplotlib-base = "*",
    scipy = "*",
    tqdm = "*",
    jupytext = "*"
}
solve-group = "shared"

[environments.wmpy.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/inst/bin/python"

[environments.wmpy.tasks]
python = {cmd="python"}
jupyter = {cmd="jupyter lab", cwd="bin/python/"}
wmpy-tests = {cmd="pytest", cwd="bin/python/wmpy"}
